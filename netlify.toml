[build]
  publish = "site"

# Enlace antiguo /android: ahora lleva a la web, que se instala desde Chrome
[[redirects]]
  from = "/android"
  to = "/"
  status = 302
  force = true

# El APK sigue disponible para quien lo necesite
[[redirects]]
  from = "/apk"
  to = "https://github.com/PERALADA/scoreflow-banda/releases/latest/download/ScoreFlow.apk"
  status = 302
  force = true
